<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Nikon ZR USB menu with MTP/PTP selected</title>
  <desc id="desc">USB menu screen showing MTP/PTP highlighted above iPhone and USB streaming options, based on Nikon ZR Reference Guide USB setting text.</desc>
  <rect width="960" height="720" fill="#000"/>
  <rect x="28" y="34" width="904" height="70" fill="#2b2b2b"/>
  <text x="48" y="84" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="48">USB</text>
  <rect x="834" y="44" width="76" height="50" rx="6" fill="none" stroke="#aaa" stroke-width="4"/>
  <path d="M884 56 L858 80 L884 104" fill="none" stroke="#ddd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="28" y="104" width="904" height="136" fill="#bfbfbf"/>
  <text x="98" y="158" fill="#000" font-family="Arial, Helvetica, sans-serif" font-size="40">Adjust settings for connection to</text>
  <text x="98" y="206" fill="#000" font-family="Arial, Helvetica, sans-serif" font-size="40">other devices via USB.</text>
  <rect x="28" y="300" width="904" height="72" fill="#f8dd4c"/>
  <text x="58" y="350" fill="#000" font-family="Arial, Helvetica, sans-serif" font-size="42">MTP/PTP</text>
  <rect x="28" y="372" width="904" height="72" fill="#222"/>
  <text x="58" y="422" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="42">iPhone</text>
  <rect x="28" y="444" width="904" height="72" fill="#222"/>
  <text x="58" y="494" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="42">USB streaming (UVC/UAC)</text>
  <rect x="28" y="604" width="904" height="70" fill="#333"/>
  <rect x="754" y="615" width="158" height="48" rx="6" fill="none" stroke="#aaa" stroke-width="3"/>
  <circle cx="784" cy="639" r="16" fill="none" stroke="#ddd" stroke-width="4"/>
  <text x="808" y="654" fill="#ddd" font-family="Arial, Helvetica, sans-serif" font-size="40">OK</text>
</svg>
