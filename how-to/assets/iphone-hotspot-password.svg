<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
  <title id="title">iPhone hotspot name and Wi-Fi password</title>
  <desc id="desc">An iPhone hotspot name and password shown as the network details to enter on the Nikon ZR.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="480" height="360" fill="#111113"/>
  <g filter="url(#shadow)">
    <rect x="42" y="36" width="164" height="292" rx="32" fill="#050507" stroke="#303038" stroke-width="2"/>
    <rect x="54" y="52" width="140" height="260" rx="22" fill="#f5f5f7"/>
    <rect x="100" y="61" width="48" height="6" rx="3" fill="#111113"/>
    <text x="124" y="92" text-anchor="middle" fill="#1d1d1f" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Personal Hotspot</text>

    <rect x="64" y="116" width="120" height="78" rx="12" fill="#ffffff"/>
    <text x="76" y="140" fill="#1d1d1f" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Allow Others to Join</text>
    <rect x="144" y="129" width="30" height="18" rx="9" fill="#34c759"/>
    <circle cx="165" cy="138" r="7" fill="#ffffff"/>
    <line x1="76" y1="154" x2="174" y2="154" stroke="#d7d7dc"/>
    <text x="76" y="176" fill="#1d1d1f" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Wi-Fi Password</text>
    <text x="174" y="176" text-anchor="end" fill="#6e6e73" font-family="Inter, Arial, sans-serif" font-size="10">ZRCTL2026</text>

    <rect x="64" y="214" width="120" height="54" rx="12" fill="#ffffff"/>
    <text x="76" y="236" fill="#6e6e73" font-family="Inter, Arial, sans-serif" font-size="9">Network name</text>
    <text x="76" y="254" fill="#1d1d1f" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">ZR Ctl iPhone</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="250" y="76" width="178" height="204" rx="18" fill="#18181b" stroke="#27272a"/>
    <text x="274" y="112" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Enter on the ZR</text>
    <text x="274" y="136" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="11">Use these values when the camera</text>
    <text x="274" y="152" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="11">searches for a Wi-Fi network.</text>

    <rect x="274" y="176" width="130" height="34" rx="9" fill="#242428" stroke="#34343a"/>
    <text x="286" y="190" fill="#71717a" font-family="JetBrains Mono, Menlo, monospace" font-size="8" font-weight="700">SSID</text>
    <text x="286" y="202" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">ZR Ctl iPhone</text>

    <rect x="274" y="222" width="130" height="34" rx="9" fill="#242428" stroke="#34343a"/>
    <text x="286" y="236" fill="#71717a" font-family="JetBrains Mono, Menlo, monospace" font-size="8" font-weight="700">PASSWORD</text>
    <text x="286" y="248" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">ZRCTL2026</text>
  </g>
  <path d="M212 165c21-14 35-14 56 0" fill="none" stroke="#ffd200" stroke-width="4" stroke-linecap="round"/>
  <path d="M222 185c15-8 25-8 40 0" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
</svg>
