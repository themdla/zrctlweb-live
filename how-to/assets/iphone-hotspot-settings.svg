<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
  <title id="title">iPhone Personal Hotspot settings</title>
  <desc id="desc">The iPhone Personal Hotspot screen with Allow Others to Join enabled.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="480" height="360" fill="#111113"/>
  <g filter="url(#shadow)">
    <rect x="156" y="18" width="168" height="324" rx="34" fill="#050507" stroke="#303038" stroke-width="2"/>
    <rect x="168" y="34" width="144" height="292" rx="24" fill="#f5f5f7"/>
    <rect x="214" y="43" width="52" height="6" rx="3" fill="#111113"/>

    <text x="184" y="72" fill="#007aff" font-family="Inter, Arial, sans-serif" font-size="10">Settings</text>
    <text x="240" y="98" text-anchor="middle" fill="#1d1d1f" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Personal Hotspot</text>

    <rect x="178" y="118" width="124" height="44" rx="12" fill="#ffffff"/>
    <text x="190" y="144" fill="#1d1d1f" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Allow Others to Join</text>
    <rect x="262" y="129" width="30" height="18" rx="9" fill="#34c759"/>
    <circle cx="283" cy="138" r="7" fill="#ffffff"/>

    <rect x="178" y="174" width="124" height="72" rx="12" fill="#ffffff"/>
    <text x="190" y="199" fill="#1d1d1f" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Wi-Fi Password</text>
    <text x="286" y="199" text-anchor="end" fill="#6e6e73" font-family="Inter, Arial, sans-serif" font-size="10">ZRCTL2026</text>
    <line x1="190" y1="212" x2="290" y2="212" stroke="#d7d7dc"/>
    <text x="190" y="232" fill="#1d1d1f" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Maximize Compatibility</text>
    <rect x="262" y="221" width="30" height="18" rx="9" fill="#34c759"/>
    <circle cx="283" cy="230" r="7" fill="#ffffff"/>

    <text x="180" y="268" fill="#6e6e73" font-family="Inter, Arial, sans-serif" font-size="9">
      <tspan x="180" dy="0">Stay on this screen until</tspan>
      <tspan x="180" dy="13">the Nikon ZR connects.</tspan>
    </text>
  </g>
  <rect x="55" y="110" width="116" height="72" rx="14" fill="#18181b" stroke="#27272a"/>
  <text x="73" y="137" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Step 1</text>
  <text x="73" y="158" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="11">Turn on</text>
  <text x="73" y="174" fill="#ffd200" font-family="JetBrains Mono, Menlo, monospace" font-size="10">Allow Others</text>
  <path d="M172 145h25" stroke="#ffd200" stroke-width="2" stroke-linecap="round"/>
  <path d="M191 137l8 8-8 8" fill="none" stroke="#ffd200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
